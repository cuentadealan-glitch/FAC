<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Proyecto AR - Temas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script>
    // Al encontrar o perder un marcador, avisa a los elementos con class="anim" que están dentro.
    // Si existe la imagen del mapa mental (data-mapa), la muestra en lugar del texto de relleno.
    AFRAME.registerComponent('reveal', {
      init: function () {
        var el = this.el;
        var url = el.getAttribute('data-mapa');
        var img = el.querySelector('.mapa-img');
        var txt = el.querySelector('.texto-reserva');
        if (url && img) {
          var probe = new Image();
          probe.onload = function () {
            img.setAttribute('src', url);
            img.setAttribute('visible', true);
            if (txt) txt.setAttribute('visible', false);
          };
          probe.src = url;
        }
        el.addEventListener('markerFound', function () {
          el.querySelectorAll('.anim').forEach(function (c) { c.emit('abrir'); });
        });
        el.addEventListener('markerLost', function () {
          el.querySelectorAll('.anim').forEach(function (c) { c.emit('cerrar'); });
        });
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instrucciones { position: fixed; bottom: 10px; left: 10px; right: 10px; color: white;
      background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px; font-family: sans-serif;
      font-size: 14px; z-index: 999; text-align: center; }
  </style>
</head>
